name: Daily Lighthouse Test BENU

on:
  schedule:
    # GitHub Actions verwendet UTC
    - cron: '0 07 * * *'
    - cron: '0 09 * * *'
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Home
            url: https://www.benu.ch/

          - name: Editorial
            url: https://www.benu.ch/e/flohsamen-das-kleine-wundermittel-mit-grosser-wirkung

          - name: PDP
            url: https://www.benu.ch/a/kijimea-reizdarm-pro-kapsel-84-stuck-1117904

          - name: Category
            url: https://www.benu.ch/c/gesundheit/

          - name: Brand
            url: https://www.benu.ch/b/la-roche-posay
          
          - name: Pharmacy
            url: https://www.benu.ch/p/benu-zurich-bahnhof-altstetten           

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Chrome Installation
        run: |
          which chrome
          chrome --version

      - name: Install Lighthouse
        run: npm install -g lighthouse

      - name: Run Lighthouse
        run: |
          lighthouse "${{ matrix.url }}" \
            --output=json \
            --output-path=./report.json \
            --chrome-path=$(which chrome) \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu" \
            --quiet

      - name: Prüfe ob Report existiert
        run: |
          ls -la
          ls -la report.json

      - name: Score als Artifact speichern
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M")

          PERF=$(python3 -c "import json; d=json.load(open('report.json')); print(round(d['categories']['performance']['score']*100))")
          ACC=$(python3 -c "import json; d=json.load(open('report.json')); print(round(d['categories']['accessibility']['score']*100))")
          SEO=$(python3 -c "import json; d=json.load(open('report.json')); print(round(d['categories']['seo']['score']*100))")
          BP=$(python3 -c "import json; d=json.load(open('report.json')); print(round(d['categories']['best-practices']['score']*100))")

          cat > score-${{ matrix.name }}.json << EOF
          {
            "date":"$DATE",
            "page":"${{ matrix.name }}",
            "performance":$PERF,
            "accessibility":$ACC,
            "seo":$SEO,
            "best_practices":$BP
          }
          EOF

          cat score-${{ matrix.name }}.json

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: score-${{ matrix.name }}
          path: score-${{ matrix.name }}.json

  update-results:
    runs-on: ubuntu-latest
    needs: lighthouse
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Alle Score-Artifacts herunterladen
        uses: actions/download-artifact@v4
        with:
          pattern: score-*
          path: ./scores

      - name: results.json aktualisieren
        run: |
          python3 << 'EOF'
          import json
          import glob
          import os

          results_file = "docs/results.json"

          if os.path.exists(results_file):
              with open(results_file, encoding="utf-8") as f:
                  data = json.load(f)
          else:
              data = []

          for file in glob.glob("scores/score-*/*.json"):
              print(f"Lese {file}")
              with open(file, encoding="utf-8") as f:
                  data.append(json.load(f))

          with open(results_file, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          print(f"Gesamt Einträge: {len(data)}")
          EOF

      - name: Sicherheitsprüfung Dashboard
        run: |
          echo "Prüfe index.html auf verdächtige Inhalte..."

          if grep -qiE "login.microsoftonline.com|Bei Ihrem Konto anmelden|ConvergedSignIn|aadcdn\.msftauth\.net" docs/index.html; then
            echo "FEHLER: Verdächtiger Login-Inhalt in docs/index.html gefunden!"
            exit 1
          fi

          echo "Dashboard-Prüfung erfolgreich."

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/results.json

          git commit -m "Lighthouse scores $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Keine Änderungen"

          git push
